<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03050a">
  <meta name="description" content="WebGPU로 브라우저 안에서 실행되는 실시간 손 추적 화면입니다.">
  <title>ACR Hand Lab — WebGPU</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="hand-stage" aria-label="실시간 3D 손 모델">
    <canvas id="skeletonCanvas" aria-label="드래그해 회전할 수 있는 3D 손 모델"></canvas>

    <aside id="cameraPip" class="cam-pip" aria-label="카메라 미리보기" hidden>
      <video id="cameraVideo" playsinline muted aria-hidden="true"></video>
      <canvas id="overlayCanvas" aria-label="손 관절이 표시된 카메라 미리보기"></canvas>
    </aside>

    <button id="startCamera" class="start-overlay" type="button">
      <span id="startLabel" class="start-title">카메라 시작</span>
      <span id="startDetail" class="start-detail">WebGPU로 이 브라우저 안에서만 처리됩니다</span>
    </button>

    <div id="liveStatus" class="sr-only" role="status" aria-live="polite">카메라 시작 대기 중</div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
